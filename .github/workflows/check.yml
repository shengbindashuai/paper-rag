name: Repository checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch for model-free tests
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check environment
        run: python scripts/check_environment.py
      - name: Run regression tests without models or API keys
        run: python -m unittest discover -s tests -t . -v
      - name: Check command entry points
        run: |
          python rag_library.py --help
          python -m retrieval.cli --help
          python -m knowledge.mcp_server --list-tools
          python scripts/download_models.py --dry-run
